name: Frozen source integrity

on:
  push:
  pull_request:

jobs:
  verify-hashes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify frozen source hashes
        run: python tools/verify_repo_integrity.py
